<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supplier Ledger</title>
<style>
:root{--bg:#eef4fb;--card:#fff;--ink:#1e2d3d;--mut:#5f7287;--line:#d5e0ec;--acc:#2f6db5;--on:#fff;--warn:#b0402c;--row:#f0f6fd;--in:#fff;--head:#e4eef9;--payBg:#e6f5ec;--payInk:#1e7b45;--retBg:#fff5c7;--retInk:#8a6a00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1823;--card:#16222f;--ink:#e3ecf5;--mut:#92a6bb;--line:#26364a;--acc:#6aa5e8;--on:#08141f;--warn:#ff9a7a;--row:#1b2a3a;--in:#0f1823;--head:#1f3045;--payBg:#173126;--payInk:#6fd39b;--retBg:#3a3318;--retInk:#f2d36b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1823;--card:#16222f;--ink:#e3ecf5;--mut:#92a6bb;--line:#26364a;--acc:#6aa5e8;--on:#08141f;--warn:#ff9a7a;--row:#1b2a3a;--in:#0f1823;--head:#1f3045;--payBg:#173126;--payInk:#6fd39b;--retBg:#3a3318;--retInk:#f2d36b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:18px;margin:0 12px 0 0}
.tabs{display:flex;gap:6px}
.tab,button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--in);color:var(--ink);padding:7px 12px;border-radius:6px}
.tab.on,button.pri{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
button.del{color:var(--warn)}
.sp{flex:1}
main{display:grid;grid-template-columns:minmax(210px,250px) minmax(0,1fr);gap:16px;padding:16px 20px;align-items:start;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.item{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:7px;cursor:pointer;background:var(--in)}
.item.on{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.item b{text-align:right;font-weight:600;font-size:13px}
.actions{position:relative;display:inline-flex;align-items:center}.more{width:28px;height:28px;padding:0;border-radius:50%;font-size:18px;line-height:1}.menu{display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:30;min-width:110px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:7px;box-shadow:0 6px 18px #0002}.menu.open{display:grid}.menu button{border:0;text-align:left;background:transparent;padding:7px 9px}.menu button:hover{background:var(--row)}.form-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}.form-panel{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--row)}.form-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}.supplier-title{font-size:20px;font-weight:700}
.item small{display:block;color:var(--mut)}
input,select{font:inherit;color:var(--ink);background:var(--in);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label{display:block;color:var(--mut);font-size:12px;margin-bottom:3px}
.add{display:flex;gap:6px;margin-top:10px}
.top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}
.name{font-size:20px;font-weight:700;max-width:300px}
.big{text-align:right}.big div{font-size:22px;font-weight:700;color:var(--warn)}.big div.z{color:var(--acc)}
.form{display:flex;flex-wrap:wrap;gap:12px 10px;align-items:flex-end}
.form>div{flex:1 1 112px;max-width:210px;min-width:0}
.form>.form-actions{flex:1 0 100%;max-width:none}
.po{display:block}.form.np .po{display:none}
.pd{display:none}.form.np .pd{display:block}.form>.pd{flex:2 1 220px;max-width:360px}
.pre{color:var(--mut);margin:8px 0 0}
.msg{color:var(--warn);margin:6px 0 0;min-height:18px}
.wrap{container-type:inline-size;overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%}
th{color:var(--mut);background:var(--head);font-weight:700;font-size:.82em;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:.95em .6em;border-bottom:2px solid var(--acc);white-space:nowrap;vertical-align:middle}
td{padding:.78em .6em;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.pay td{background:var(--payBg)}tbody tr.ret td{background:var(--retBg)}
tbody tr:hover td{background-image:linear-gradient(rgba(47,109,181,.07),rgba(47,109,181,.07))}
.bd{display:inline-block;padding:.15em .75em;border-radius:999px;font-size:.92em;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.b-pur{background:var(--head);color:var(--acc)}.b-pay{background:rgba(30,123,69,.16);color:var(--payInk)}.b-ret{background:rgba(180,140,0,.2);color:var(--retInk)}
.cr{color:var(--payInk);font-weight:600}tr.ret .cr{color:var(--retInk)}
td.pr{font-weight:500}td.c{text-align:center}th.c{text-align:center}
table{font-size:var(--tf,13px);font-variant-numeric:tabular-nums}
.form-head b{font-size:15px}
.r{text-align:right}th.r{text-align:right}.mut{color:var(--mut)}
td button{padding:3px 8px;font-size:12px}
h3{margin:18px 0 6px;font-size:15px}
.empty{color:var(--mut);padding:18px 4px}
[hidden]{display:none!important}
.cb{position:relative}.cb::after{content:"▾";position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--mut)}
.dd{position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:2px;min-width:170px;max-height:220px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 22px rgba(0,0,0,.2)}
.dd .o{padding:8px 10px;cursor:pointer}.dd .o:hover{background:var(--row)}.dd .nw{color:var(--acc);font-weight:600}.search-select{position:relative}.search-select input{width:100%}.search-select .dd{display:none}.search-select.open .dd{display:block}.search-select .dd .empty-option{padding:9px 10px;color:var(--mut)}.filter-search{margin:8px 0 10px}.filter-search input{max-width:100%}
h2.t{margin:0;font-size:20px}
.ledbar{display:flex;gap:8px;margin-top:14px;align-items:center}.ledbar input{flex:1}.ledbar button{white-space:nowrap}
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,20,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}.modal .box{background:var(--card);border:1px solid var(--line);border-radius:10px;width:min(1500px,100%);max-height:92vh;overflow:visible;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}.modal h3{margin:0 0 14px;font-size:16px}.fgrid .dd{max-height:200px}.fgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
@media(max-width:1100px){.fgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}.modal .btns{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
.themebtn:hover{background:var(--row)}.themebtn{width:34px;height:34px;padding:0;border-radius:50%;font-size:17px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none}
@media(max-height:720px),(max-width:640px){.modal .box{overflow:auto;padding-bottom:150px}}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr);padding:12px}header{padding:12px}.name{max-width:100%}}
@media(max-width:560px){header{gap:8px}header button{padding:6px 9px}.tabs{width:100%}.tab{flex:1}.sp{display:none}}
</style></head><body>
<header><h1>Supplier Ledger</h1>
<div class="tabs"><button class="tab on" id="t1" onclick="go(1)">Suppliers</button><button class="tab" id="t2" onclick="go(2)">Purchases by category</button></div>
<span class="sp"></span>
<button class="pri" onclick="downloadExcel()" title="Downloads the Excel workbook for the tab you are on">Download Excel</button><button onclick="exp()">Export backup</button><button onclick="document.getElementById('imp').click()">Import backup</button>
<input type="file" id="imp" accept=".json" hidden onchange="imp(this)">
<button class="themebtn" id="themebtn" onclick="toggleTheme()" aria-label="Toggle light/dark theme" title="Toggle light/dark theme">☾</button>
</header>
<main id="p1">
<div class="card"><div id="sl"></div><div class="add"><input id="ns" placeholder="New supplier name" onkeydown="if(event.key==='Enter')addSup()"><button class="pri" onclick="addSup()">Add</button></div></div>
<div class="card" id="sr"></div>
</main>
<main id="p2" hidden>
<div class="card"><div id="cl"></div></div>
<div class="card" id="cr"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
/* ---------- Zoom & theme (device-only, not synced) ---------- */
const UIK='supplier-ledger-ui';
let UI={theme:''};
try{UI=Object.assign(UI,JSON.parse(localStorage.getItem(UIK))||{})}catch(e){}
const saveUI=()=>{try{localStorage.setItem(UIK,JSON.stringify(UI))}catch(e){}};
function curTheme(){return UI.theme||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function applyTheme(){const t=curTheme();document.documentElement.setAttribute('data-theme',t);const b=document.getElementById('themebtn');if(b){b.textContent=t==='dark'?'☀':'☾';b.title=t==='dark'?'Switch to light theme':'Switch to dark theme'}}
function toggleTheme(){UI.theme=curTheme()==='dark'?'light':'dark';applyTheme();saveUI()}
applyTheme();

const KEY='supplier-ledger-v1';
const SUPABASE_URL='https://tylwxpuarmkdbrhgiztb.supabase.co';
const SUPABASE_KEY='sb_publishable_B6j8kX4ZSa55zidjzQPsqw_Yr9Pn34e';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let S=null;
let localSaved=false;
try{S=JSON.parse(localStorage.getItem(KEY));localSaved=!!(S&&S.suppliers&&S.entries)}catch(e){}

const defaultState=()=>({
  suppliers:[],
  cats:['RAW MATERIAL','FIXED ASSET','SPARE PARTS','LABORATORY','CHEMICAL','OTR TICKETS','FINISHED GOODS','NO CATEGORY'],
  units:['PCS','CTN','KG','LTR'],
  curs:['XOF','USD','EUR'],
  entries:[],
  sel:null,
  csel:''
});
if(!S||!S.suppliers)S=defaultState();

let writeTimer=null;
let remoteReady=false;
let applyingRemote=false;

const DEFAULT_CATS=['RAW MATERIAL','FIXED ASSET','SPARE PARTS','LABORATORY','CHEMICAL','OTR TICKETS','FINISHED GOODS','NO CATEGORY'];
/* Category list = default categories + only those custom categories that existing entries use */
function syncCats(){
  const used=[];
  (S.entries||[]).forEach(e=>{const c=(e.cat||'').trim();if(c&&!DEFAULT_CATS.includes(c.toUpperCase())&&!used.includes(c))used.push(c)});
  S.cats=[...DEFAULT_CATS,...used.sort()];
}
function normalizeState(){
  S.units=S.units||['PCS','CTN','KG','LTR'];
  S.curs=(S.curs||[]).map(c=>c==='XOF'?'CFA':c);
  S.entries=S.entries||[];
  syncCats();
  S.entries.forEach(e=>{if(e.cur==='XOF')e.cur='CFA'});
  ['CFA','USD','EUR','AED'].forEach(c=>{if(!S.curs.includes(c))S.curs.push(c)});
  if(S.sel&&!S.suppliers.some(s=>s.id===S.sel))S.sel=S.suppliers[0]?.id||null;
  if(!S.suppliers.length)S.sel=null;
  S.csel='';
}

const save=()=>{
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(!remoteReady||applyingRemote)return;
  clearTimeout(writeTimer);
  writeTimer=setTimeout(async()=>{
    writeTimer=null;
    const snapshot=JSON.parse(JSON.stringify(S));
    const {error}=await sb.from('supplier_ledger_state').upsert({
      id:1,data:snapshot,updated_at:new Date().toISOString()
    });
    if(error)console.error('Shared ledger save failed:',error);
  },350);
};

async function initShared(){
  try{
    const {data,error}=await sb.from('supplier_ledger_state')
      .select('data').eq('id',1).single();
    if(error)throw error;

    const remote=data&&data.data;
    if(remote&&Array.isArray(remote.suppliers)&&Array.isArray(remote.entries)){
      S=remote;
    }else if(!localSaved){
      S=defaultState();
    }

    normalizeState();
    remoteReady=true;
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}

    if(!remote||!Array.isArray(remote.suppliers)||!Array.isArray(remote.entries)){
      const {error:seedError}=await sb.from('supplier_ledger_state').upsert({
        id:1,data:S,updated_at:new Date().toISOString()
      });
      if(seedError)throw seedError;
    }

    go(1);

    sb.channel('supplier-ledger-live')
      .on('postgres_changes',{
        event:'*',schema:'public',table:'supplier_ledger_state',filter:'id=eq.1'
      },payload=>{
        const incoming=payload.new&&payload.new.data;
        if(!incoming||!Array.isArray(incoming.suppliers)||!Array.isArray(incoming.entries))return;
        if(writeTimer)return;
        if(JSON.stringify(incoming)===JSON.stringify(S))return;
        applyingRemote=true;
        S=incoming;
        normalizeState();
        try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        applyingRemote=false;
        if(page===1){
          if(hasForm){renderSupList();renderLedger()}else{renderSup()}
        }else{renderCat()}
      })
      .subscribe();
  }catch(error){
    console.error('Shared ledger connection failed:',error);
    normalizeState();
    go(1);
    alert('Could not connect to the shared ledger. Check your Supabase table permissions and internet connection. Details are in the browser console.');
  }
};

const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=d=>d?d.split('-').reverse().join('-'):'';
const TL={purchase:'Purchase',payment:'Payment',debitadj:'Debit Adjustment',creditadj:'Credit Adjustment',return:'Return'};
const isDr=e=>e.type==='purchase'||e.type==='debitadj';
let editId=null,page=1,hasForm=false;
function arm(b,fn){if(b.dataset.a){fn();return}b.dataset.a=1;const t=b.textContent;b.textContent='Click again to confirm';setTimeout(()=>{delete b.dataset.a;b.textContent=t},3000)}
function sums(list,f){const o={};list.forEach(e=>{o[e.cur]=(o[e.cur]||0)+f(e)});return o}
function cs(o,empty){const k=Object.keys(o).filter(c=>Math.abs(o[c])>0.004);return k.length?k.map(c=>c+' '+fmt(o[c])).join('<br>'):(empty||'0.00')}
function bal(sid){return sums(S.entries.filter(e=>e.sid===sid),e=>isDr(e)?e.amount:-e.amount)}
function ensure(list,v){v=(v||'').trim();if(v&&!list.some(x=>x.toLowerCase()===v.toLowerCase()))list.push(v);return v}
function go(n){page=n;$('p1').hidden=n!==1;$('p2').hidden=n!==2;$('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2);n===1?renderSup():renderCat()}
function lists(){}
const OPTS={cat:()=>S.cats,unit:()=>S.units,cur:()=>S.curs,prod:()=>{
    const t=val('ftype'),uniq=l=>[...new Set(l.filter(Boolean))];
    if(t==='purchase'||t==='return'){
      const c=val('fcat');if(!c)return [];
      return uniq(S.entries.filter(e=>(e.type==='purchase'||e.type==='return')&&(e.cat||'NO CATEGORY').toLowerCase()===c.toLowerCase()).map(e=>e.prod));
    }
    return uniq(S.entries.map(e=>e.prod));
  }};
const needCat=k=>k==='prod'&&['purchase','return'].includes(val('ftype'))&&!val('fcat');
const NEWL={cat:'category',unit:'unit',cur:'currency',prod:'product'};
const NEWT={cat:'New Category',unit:'New Unit',prod:'New Product',cur:'New Currency'};
const FID={cat:'fcat',unit:'funit',prod:'fprod',cur:'fcur'};
function fopts(k){return OPTS[k]();}
function val(id){return $(id).value||''}
function optionKey(ev,k){if(ev.key==='Enter'){ev.preventDefault();const q=$(`${FID[k]}_search`).value.trim();const opts=fopts(k);const exact=opts.find(x=>x.toLowerCase()===q.toLowerCase());if(exact)chooseOption(k,exact);else if(q)chooseOption(k,q,true)}}
/* Register whatever is typed when the user clicks away (existing option -> selected, otherwise -> new) */
function commitOption(k){
  const input=$(`${FID[k]}_search`),sel=$(FID[k]),box=$(`${FID[k]}_box`);
  if(!input||!sel)return;
  const t=input.value.trim();
  if(box)box.classList.remove('open');
  if(!t){if(k==='cur'){input.value=sel.value}else if(sel.value){sel.value='';if(k==='prod')pv()}return}
  const ex=fopts(k).find(x=>String(x).toLowerCase()===t.toLowerCase());
  const target=ex||t;
  if(sel.value&&sel.value.toLowerCase()===String(target).toLowerCase()){input.value=sel.value;return}
  chooseOption(k,target,!ex);
}
function searchOptions(k,showAll){
  const input=$(`${FID[k]}_search`),box=$(`${FID[k]}_box`),dd=$(`${FID[k]}_dd`);
  if(!input||!box||!dd)return;
  const q=showAll?'':input.value.trim().toLowerCase(),opts=fopts(k);
  const matches=opts.filter(x=>String(x).toLowerCase().includes(q));
  let html=needCat(k)?'<div class="empty-option">Choose a category first to see its products</div>':matches.map(x=>`<div class="o" onmousedown="event.preventDefault()" onclick="chooseOption('${k}',decodeURIComponent('${encodeURIComponent(x)}') )">${esc(x)}</div>`).join('');
  if(q&&!matches.some(x=>String(x).toLowerCase()===q))html+=`<div class="o nw" onmousedown="event.preventDefault()" onclick="chooseOption('${k}',decodeURIComponent('${encodeURIComponent(input.value.trim())}'),true)">＋ New ${NEWT[k].replace(/^New /,'')} “${esc(input.value.trim())}”</div>`;
  if(!html)html='<div class="empty-option">No matches</div>';
  dd.innerHTML=html;box.classList.add('open');
}
function chooseOption(k,v,isNew=false){
  v=String(v||'').trim();if(!v)return;
  if(k==='cat'){v=v.toUpperCase();if(isNew){/* added to the list only once an entry is saved with it */}else if(!S.cats.some(x=>x.toLowerCase()===v.toLowerCase()))v='NO CATEGORY';else v=S.cats.find(x=>x.toLowerCase()===v.toLowerCase());}
  if(k==='unit'&&isNew){ensure(S.units,v);save()}
  if(k==='cur'&&isNew){ensure(S.curs,v.toUpperCase());v=v.toUpperCase();save()}
  if(k==='cur')v=v.toUpperCase();
  const sel=$(FID[k]);
  if(![...sel.options].some(o=>o.value===v))sel.add(new Option(v,v));
  sel.value=v;$(`${FID[k]}_search`).value=v;$(`${FID[k]}_box`).classList.remove('open');
  if(k==='cat'){fill('prod');$('fprod_search').value='';}
  if(k==='cur')pv();
}
function fill(k){
  const s=$(FID[k]);
  s.innerHTML=(k==='cur'?'':`<option value="">Select ${NEWL[k]}</option>`)+fopts(k).map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
  s.value=k==='cur'?'CFA':'';
  const input=$(`${FID[k]}_search`);if(input)input.value=k==='cur'?'CFA':'';
  const box=$(`${FID[k]}_box`);if(box)box.classList.remove('open');
}
function setv(k,v){fill(k);const s=$(FID[k]);if(v&&![...s.options].some(o=>o.value===v))s.add(new Option(v,v));s.value=v||(k==='cur'?'CFA':'');$(`${FID[k]}_search`).value=s.value}
function selChg(s){/* retained for compatibility */}


/* ---------- Suppliers ---------- */
function addSup(){const n=$('ns').value.trim();if(!n)return;const id='s'+uid();S.suppliers.push({id,name:n});S.sel=id;$('ns').value='';save();hasForm=false;renderSup()}
function pick(id){S.sel=id;window.ledQuery='';window.ledF={};editId=null;hasForm=false;save();renderSup()}
function renameSup(v){const s=S.suppliers.find(x=>x.id===S.sel);if(s&&v.trim()){s.name=v.trim();save();renderSupList()}}
function delSup(){S.entries=S.entries.filter(e=>e.sid!==S.sel);syncCats();S.suppliers=S.suppliers.filter(s=>s.id!==S.sel);S.sel=S.suppliers[0]?S.suppliers[0].id:null;save();hasForm=false;renderSup()}
function renderSupList(){$('sl').innerHTML=S.suppliers.map(s=>`<div class="item ${s.id===S.sel?'on':''}" onclick="pick('${s.id}')"><span>${esc(s.name)}</span><b>${cs(bal(s.id))}</b></div>`).join('')||'<div class="empty">No suppliers yet.</div>';const b=$('bal');if(b){const x=bal(S.sel);b.innerHTML=cs(x);b.className=Object.keys(x).some(c=>Math.abs(x[c])>0.004)?'':'z'}}
function renderSup(){
  lists();renderSupList();
  const s=S.suppliers.find(x=>x.id===S.sel);
  if(!s){$('sr').innerHTML='<div class="empty">Add a supplier on the left to begin.</div>';return}

function supDefaults(sid){
  const l=S.entries.filter(e=>e.sid===sid);let cur=null,tva=null;
  for(let i=l.length-1;i>=0;i--){
    const e=l[i];
    if(cur===null&&e.cur)cur=e.cur;
    if(tva===null&&(e.type==='purchase'||e.type==='return')&&e.tvaPct!==undefined&&e.tvaPct!==null)tva=e.tvaPct;
    if(cur!==null&&tva!==null)break;

}

const XL={blue:'FF2F6DB5',ink:'FF1E2D3D',line:'FFD5E0EC',white:'FFFFFFFF',green:'FFE6F5EC',greenInk:'FF1E7B45',yel:'FFFFF5C7',yelInk:'FF8A6A00'};

function xlName(n){let b=String(n||'Sheet').replace(/[\\\/\?\*\[\]:]/g,' ').trim().slice(0,31)||'Sheet',x=b,i=2;while(xlNames.has(x.toLowerCase())){const t=' ('+i++ +')';x=b.slice(0,31-t.length)+t}xlNames.add(x.toLowerCase());return x}
function xlTable(wb,name,cols,rows,typeCol,boldCol){
  const ws=wb.addWorksheet(name,{views:[{state:'frozen',ySplit:1}]});
  ws.columns=cols.map(c=>({header:c[0],width:c[1]}));
  const th={style:'thin',color:{argb:XL.line}},bd={top:th,left:th,bottom:th,right:th};
  const hr=ws.getRow(1);hr.height=26;
  hr.eachCell((c,n)=>{c.font={bold:true,color:{argb:'FFFFFFFF'},size:11,name:'Calibri'};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:XL.blue}};c.alignment={vertical:'middle',horizontal:cols[n-1][3]==='right'?'right':'center',wrapText:true};c.border=bd});
  rows.forEach(r=>{
    const row=ws.addRow(r.v);
    const bg=r.kind==='pay'?XL.green:r.kind==='yel'?XL.yel:XL.white;
    row.eachCell({includeEmpty:true},(c,n)=>{
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:bg}};c.border=bd;
      c.font={name:'Calibri',size:11,color:{argb:XL.ink}};
      c.alignment={vertical:'middle',horizontal:cols[n-1][3]};
      if(cols[n-1][2]==='auto')c.numFmt=Number.isInteger(c.value)?'#,##0':'#,##0.####';
      else if(cols[n-1][2])c.numFmt=cols[n-1][2];
    });
    if(typeCol&&r.kind!=='white')row.getCell(typeCol).font={name:'Calibri',size:11,bold:true,color:{argb:r.kind==='pay'?XL.greenInk:XL.yelInk}};
    if(boldCol)row.getCell(boldCol).font={name:'Calibri',size:11,bold:true,color:{argb:XL.ink}};
    if(r.link){const c=row.getCell(r.link.col);c.value={text:String(c.value),hyperlink:r.link.ref};c.font={name:'Calibri',size:11,underline:true,color:{argb:XL.blue}}}
  });
  ws.autoFilter={from:{row:1,column:1},to:{row:1,column:cols.length}};
  ws.pageSetup={orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0};
  return ws;
}

  const wb=new ExcelJS.Workbook();wb.creator='Supplier Ledger';wb.created=new Date();
  const sups=[...S.suppliers].sort((a,b)=>a.name.localeCompare(b.name));
  const idxCols=[['Supplier',34,null,'center'],['Currency',12,null,'center'],['Balance Owed',20,BF,'right'],['Transactions',14,'0','center']];
  const idxRows=[],sheets=[];
  const cols=[['Date',12,'dd-mm-yyyy','center'],['Type',18,null,'center'],['Invoice / Ref',16,null,'center'],['Category',18,null,'center'],['Product',28,null,'center'],['Quantity',12,QF,'center'],['Unit',9,null,'center'],['Currency',10,null,'center'],['Unit Price',15,NF,'right'],['TVA %',9,'auto','center'],['TVA Amount',15,NF,'right'],['Transport',14,NF,'right'],['Debit',16,NF,'right'],['Payment / Credit',17,NF,'right'],['Balance',17,BF,'right']];
  sups.forEach(s=>{
    const list=S.entries.map((e,i)=>({e,i})).filter(x=>x.e.sid===s.id).sort((a,b)=>a.e.date<b.e.date?-1:a.e.date>b.e.date?1:a.i-b.i).map(x=>x.e);
    const sheet=xlName(s.name),run={},cnt={};
    const rows=list.map(e=>{
      const d=isDr(e),p=e.type==='purchase'||e.type==='return';
      run[e.cur]=(run[e.cur]||0)+(d?e.amount:-e.amount);cnt[e.cur]=(cnt[e.cur]||0)+1;
      return {kind:xlKind(e),v:[xlDate(e.date),TL[e.type]||e.type,e.inv||'',e.cat||'',(p?e.prod:(e.desc||e.prod))||'',p?e.qty:null,p?(e.unit||''):'',e.cur||'',p?e.price:null,p?e.tvaPct:null,p?e.tva:null,p?(e.transport||0):null,d?e.amount:null,d?null:e.amount,run[e.cur]]}
    });
    sheets.push([sheet,cols,rows]);
    const link={col:1,ref:"#'"+sheet.replace(/'/g,"''")+"'!A1"};
    const curs=Object.keys(run);
    if(!curs.length)idxRows.push({kind:'white',link,v:[s.name,'—',0,0]});
    else curs.forEach(c=>idxRows.push({kind:'white',link,v:[s.name,c,run[c],cnt[c]]}));
  });
  xlTable(wb,'Index',idxCols,idxRows,null,3);
  sheets.forEach(x=>xlTable(wb,x[0],x[1],x[2],2,15));
  await xlSave(wb,'supplier-ledger-suppliers');
}
async function downloadCategoryExcel(){
  xlNames.clear();
  const wb=new ExcelJS.Workbook();wb.creator='Supplier Ledger';wb.created=new Date();
  const sn=id=>(S.suppliers.find(s=>s.id===id)||{name:'(deleted)'}).name;
  const purchases=S.entries.filter(e=>e.type==='purchase').sort((a,b)=>sn(a.sid).localeCompare(sn(b.sid))||(a.date<b.date?-1:a.date>b.date?1:0));
  const cols=[['Date',12,'dd-mm-yyyy','center'],['Supplier',26,null,'center'],['Invoice / Ref',16,null,'center'],['Category',18,null,'center'],['Product',28,null,'left'],['Quantity',12,QF,'center'],['Unit',9,null,'center'],['Currency',10,null,'center'],['Unit Price',15,NF,'right'],['TVA %',9,'auto','center'],['TVA Amount',15,NF,'right'],['Transport',14,NF,'right'],['Total with TVA',18,NF,'right']];
  const mk=l=>l.map(e=>({kind:'white',v:[xlDate(e.date),sn(e.sid),e.inv||'',e.cat||'NO CATEGORY',e.prod||'',e.qty,e.unit||'',e.cur||'',e.price,e.tvaPct,e.tva,e.transport||0,e.amount]}));
  const catOf=e=>e.cat||'NO CATEGORY';
  const catList=[...S.cats];purchases.forEach(e=>{if(!catList.includes(catOf(e)))catList.push(catOf(e))});
  xlTable(wb,xlName('All Categories'),cols,mk(purchases),null,13);
  catList.forEach(c=>xlTable(wb,xlName(c),cols,mk(purchases.filter(e=>catOf(e)===c)),null,13));
  await xlSave(wb,'supplier-ledger-categories');
}

function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.suppliers||!d.entries)throw 0;S=d;normalizeState();save();hasForm=false;go(page)}catch(e){alert('That file is not a valid backup.')}};r.readAsText(f)}
document.addEventListener('click',e=>{document.querySelectorAll('.search-select.open').forEach(box=>{if(!box.contains(e.target))box.classList.remove('open')});document.querySelectorAll('.menu.open').forEach(m=>{if(!m.parentElement.contains(e.target))m.classList.remove('open')})});
/* ---------- Fit tables to the available width (shrinks text only when needed) ---------- */
function fitTables(){
  document.querySelectorAll('.wrap').forEach(w=>{
    const t=w.querySelector('table');if(!t||!w.offsetParent)return;
    let f=13;w.style.setProperty('--tf',f+'px');
    for(let i=0;i<4;i++){
      const need=t.offsetWidth,have=w.clientWidth;
      if(need<=have+1)break;
      f=Math.max(9.5,f*have/need*0.995);w.style.setProperty('--tf',f.toFixed(2)+'px');
    }
  });
}
(function(){
  const rl=renderLedger,rc=renderCat;
  renderLedger=function(){rl.apply(this,arguments);fitTables()};
  renderCat=function(){rc.apply(this,arguments);fitTables()};
  let t;window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(fitTables,60)});
})();
initShared();
